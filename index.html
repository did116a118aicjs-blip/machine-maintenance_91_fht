    <!-- Script Application Logic -->
    <script>
        const WEB_APP_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE'; // เปลี่ยนเป็น URL ของคุณ

        let currentFilterStatus = 'ทั้งหมด';
        let machines = JSON.parse(localStorage.getItem('app_machines')) || [];
        let mechanics = JSON.parse(localStorage.getItem('app_mechanics')) || [];
        let workOrders = JSON.parse(localStorage.getItem('app_orders')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
            fetchDataFromSheet(); // โหลดข้อมูลสดแบบเบื้องหลังทันที
        });

        async function fetchDataFromSheet() {
            if (WEB_APP_URL.includes('YOUR_GOOGLE')) return;
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getData`);
                const data = await res.json();
                if (data.orders) workOrders = data.orders;
                if (data.machines) machines = data.machines;
                if (data.mechanics) mechanics = data.mechanics;
                
                localStorage.setItem('app_machines', JSON.stringify(machines));
                localStorage.setItem('app_mechanics', JSON.stringify(mechanics));
                localStorage.setItem('app_orders', JSON.stringify(workOrders));
                renderAll();
            } catch (e) {
                console.error("Sync error:", e);
            }
        }

        async function callSheetAPI(action, payload) {
            document.getElementById('sync-loading').classList.remove('hidden');
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify({ action, payload })
                });
                // รอสักครู่แล้วดึงข้อมูลล่าสุดกลับมา
                setTimeout(async () => {
                    await fetchDataFromSheet();
                    document.getElementById('sync-loading').classList.add('hidden');
                }, 1500);
            } catch (e) {
                console.error(e);
                document.getElementById('sync-loading').classList.add('hidden');
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ Google Sheets');
            }
        }

        function renderAll() {
            renderMachineOptions();
            renderMechanicsOptions();
            renderDashboard();
            renderOrdersList();
            renderMechanicsList();
            renderMachinesList();
        }

        function switchTab(tabId) {
            ['dashboard', 'create', 'orders', 'settings'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.toggle('hidden', id !== tabId);
                const navM = document.getElementById(`nav-${id}`);
                if (navM) {
                    navM.className = `nav-item flex flex-col items-center ${id === tabId ? 'text-brand-600' : 'text-slate-400'}`;
                }
                const navT = document.getElementById(`top-nav-${id}`);
                if (navT) {
                    navT.className = `top-nav-item px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 transition-all ${id === tabId ? 'bg-brand-800 text-white' : 'text-slate-200 hover:bg-brand-600'}`;
                }
            });
            window.scrollTo(0, 0);
        }

        function switchSettingsSubTab(sub) {
            document.getElementById('subtab-btn-mechanics').className = `flex-1 py-2 rounded-lg text-center ${sub === 'mechanics' ? 'bg-white shadow-sm text-brand-700' : 'text-slate-600'}`;
            document.getElementById('subtab-btn-machines').className = `flex-1 py-2 rounded-lg text-center ${sub === 'machines' ? 'bg-white shadow-sm text-brand-700' : 'text-slate-600'}`;
            document.getElementById('subtab-mechanics').classList.toggle('hidden', sub !== 'mechanics');
            document.getElementById('subtab-machines').classList.toggle('hidden', sub !== 'machines');
        }

        function filterAndNavigate(status) { filterOrders(status); switchTab('orders'); }
        function filterOrders(status) {
            currentFilterStatus = status.trim();
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.className = `filter-btn px-4 py-2.5 rounded-xl font-medium whitespace-nowrap ${btn.innerText.includes(currentFilterStatus) ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`;
            });
            renderOrdersList();
        }

        function renderDashboard() {
            document.getElementById('stat-pending').innerText = workOrders.filter(o => o.status === 'รอรับเรื่อง').length;
            document.getElementById('stat-repairing').innerText = workOrders.filter(o => o.status === 'กำลังซ่อม').length;
            document.getElementById('stat-waiting-parts').innerText = workOrders.filter(o => o.status === 'รออะไหล่').length;
            document.getElementById('stat-completed').innerText = workOrders.filter(o => o.status === 'ซ่อมเสร็จสิ้น').length;

            const container = document.getElementById('dashboard-orders-list');
            const recent = [...workOrders].reverse().slice(0, 6);
            container.innerHTML = recent.length === 0 ? `<div class="col-span-full bg-white p-6 rounded-2xl text-center text-slate-400 text-xs">ยังไม่มีประวัติการแจ้งซ่อม</div>` : recent.map(o => createOrderCard(o)).join('');
        }

        function renderOrdersList() {
            const container = document.getElementById('full-orders-list');
            let filtered = currentFilterStatus === 'ทั้งหมด' ? workOrders : workOrders.filter(o => o.status === currentFilterStatus);
            container.innerHTML = filtered.length === 0 ? `<div class="col-span-full bg-white p-8 rounded-2xl text-center text-slate-400 text-xs">ไม่พบรายการแจ้งซ่อม</div>` : [...filtered].reverse().map(o => createOrderCard(o)).join('');
        }

        function createOrderCard(o) {
            const mc = machines.find(m => String(m.id) === String(o.machineId)) || { name: o.machineId };
            let badge = o.status === 'รอรับเรื่อง' ? 'bg-amber-100 text-amber-700' : o.status === 'กำลังซ่อม' ? 'bg-blue-100 text-blue-700' : o.status === 'รออะไหล่' ? 'bg-purple-100 text-purple-700' : 'bg-emerald-100 text-emerald-700';
            return `
                <div class="bg-white p-4.5 rounded-2xl shadow-sm border border-slate-200 flex flex-col justify-between space-y-3">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <div><span class="text-[11px] font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded-md">${o.machineId}</span><h3 class="font-bold text-slate-800 text-sm mt-1">${mc.name}</h3></div>
                            <span class="px-2.5 py-1 ${badge} rounded-lg text-[11px] font-semibold">${o.status}</span>
                        </div>
                        <div class="text-xs text-slate-500 space-y-1 mt-2 bg-slate-50 p-2.5 rounded-xl">
                            <div><strong class="text-slate-700">อาการ:</strong> ${o.symptom}</div>
                            <div><strong class="text-slate-700">ผู้แจ้ง:</strong> ${o.reporterNickname} (${o.reporterEmpId})</div>
                            <div><strong class="text-slate-700">ช่าง:</strong> ${o.mechanic || '-'}</div>
                        </div>
                    </div>
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-[11px] text-slate-400">
                        <span>${o.createdAt}</span>
                        <button onclick="openModal('${o.id}')" class="px-3 py-1.5 bg-brand-50 text-brand-700 font-semibold rounded-lg">จัดการ</button>
                    </div>
                </div>
            `;
        }

        function renderMachineOptions() {
            document.getElementById('form-machine-id').innerHTML = machines.map(m => `<option value="${m.id}">[${m.id}] ${m.name}</option>`).join('');
        }
        function renderMechanicsOptions() {
            document.getElementById('modal-mechanic-select').innerHTML = `<option value="">-- เลือกช่าง --</option>` + mechanics.map(m => `<option value="${m.nickname}">${m.nickname} (${m.empId})</option>`).join('');
        }
        function renderMechanicsList() {
            document.getElementById('mechanics-list').innerHTML = mechanics.length === 0 ? `<div class="py-4 text-center text-slate-400 text-xs">ไม่มีข้อมูลช่าง</div>` : mechanics.map(m => `<div class="py-3 flex justify-between text-xs"><div><b>${m.nickname}</b> (${m.empId})<br><span class="text-slate-400">${m.skill||'-'}</span></div><button onclick="deleteMechanic('${m.empId}')" class="text-rose-500"><i class="fa-solid fa-trash-can"></i></button></div>`).join('');
        }
        function renderMachinesList() {
            document.getElementById('machines-list').innerHTML = machines.length === 0 ? `<div class="py-4 text-center text-slate-400 text-xs">ไม่มีข้อมูลเครื่องจักร</div>` : machines.map(m => `<div class="py-3 flex justify-between text-xs"><div><b>[${m.id}] ${m.name}</b><br><span class="text-slate-400">${m.location||'-'} / ${m.line||'-'}</span></div><button onclick="deleteMachine('${m.id}')" class="text-rose-500"><i class="fa-solid fa-trash-can"></i></button></div>`).join('');
        }

        function handleCreateOrder(e) {
            e.preventDefault();
            const now = new Date();
            const newOrder = {
                id: 'WO-' + Date.now().toString().slice(-6),
                machineId: document.getElementById('form-machine-id').value,
                symptom: document.getElementById('form-symptom').value,
                urgency: document.getElementById('form-urgency').value,
                reporterEmpId: document.getElementById('form-reporter-emp-id').value,
                reporterNickname: document.getElementById('form-reporter-nickname').value,
                status: 'รอรับเรื่อง',
                mechanic: '-', solution: '', parts: '-', cost: 0,
                createdAt: `${now.getDate()}/${now.getMonth()+1}/${now.getFullYear()+543} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`
            };
            workOrders.push(newOrder);
            localStorage.setItem('app_orders', JSON.stringify(workOrders));
            renderDashboard(); renderOrdersList(); switchTab('dashboard');
            document.getElementById('repair-form').reset();
            callSheetAPI('saveOrder', newOrder);
        }

        function openModal(id) {
            const o = workOrders.find(x => String(x.id) === String(id));
            if (!o) return;
            document.getElementById('modal-order-id').value = o.id;
            document.getElementById('modal-mechanic-select').value = o.mechanic !== '-' ? o.mechanic : '';
            document.getElementById('modal-solution').value = o.solution || '';
            document.getElementById('modal-parts').value = o.parts !== '-' ? o.parts : '';
            document.getElementById('modal-cost').value = o.cost || 0;
            document.getElementById('modal-status').value = o.status;
            document.getElementById('action-modal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('action-modal').classList.add('hidden'); }

        function handleSaveRepairWork(e) {
            e.preventDefault();
            const id = document.getElementById('modal-order-id').value;
            const o = workOrders.find(x => String(x.id) === String(id));
            if (!o) return;
            o.mechanic = document.getElementById('modal-mechanic-select').value;
            o.solution = document.getElementById('modal-solution').value;
            o.parts = document.getElementById('modal-parts').value;
            o.cost = parseFloat(document.getElementById('modal-cost').value) || 0;
            o.status = document.getElementById('modal-status').value;

            localStorage.setItem('app_orders', JSON.stringify(workOrders));
            closeModal(); renderDashboard(); renderOrdersList();
            callSheetAPI('updateOrder', o);
        }

        function deleteWorkOrder() {
            const id = document.getElementById('modal-order-id').value;
            if (confirm('ต้องการลบรายการนี้?')) {
                workOrders = workOrders.filter(x => String(x.id) !== String(id));
                localStorage.setItem('app_orders', JSON.stringify(workOrders));
                closeModal(); renderDashboard(); renderOrdersList();
                callSheetAPI('deleteOrder', { id });
            }
        }

        function handleAddMechanic(e) {
            e.preventDefault();
            const m = { empId: document.getElementById('add-tech-emp-id').value, nickname: document.getElementById('add-tech-nickname').value, skill: document.getElementById('add-tech-skill').value };
            mechanics.push(m);
            localStorage.setItem('app_mechanics', JSON.stringify(mechanics));
            renderMechanicsList(); renderMechanicsOptions(); e.target.reset();
            callSheetAPI('saveMechanic', m);
        }
        function deleteMechanic(empId) {
            if (confirm('ลบช่างคนนี้?')) {
                mechanics = mechanics.filter(x => x.empId !== empId);
                localStorage.setItem('app_mechanics', JSON.stringify(mechanics));
                renderMechanicsList(); renderMechanicsOptions();
                callSheetAPI('deleteMechanic', { empId });
            }
        }

        function handleAddMachine(e) {
            e.preventDefault();
            const m = { id: document.getElementById('add-mc-code').value, name: document.getElementById('add-mc-name').value, location: document.getElementById('add-mc-location').value, line: document.getElementById('add-mc-line').value };
            machines.push(m);
            localStorage.setItem('app_machines', JSON.stringify(machines));
            renderMachinesList(); renderMachineOptions(); e.target.reset();
            callSheetAPI('saveMachine', m);
        }
        function deleteMachine(id) {
            if (confirm('ลบเครื่องจักรนี้?')) {
                machines = machines.filter(x => x.id !== id);
                localStorage.setItem('app_machines', JSON.stringify(machines));
                renderMachinesList(); renderMachineOptions();
                callSheetAPI('deleteMachine', { id });
            }
        }
    </script>
</body>
</html>
